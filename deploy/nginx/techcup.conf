# nginx site for a native Linux deployment of TechCup Fútbol.
#
# - Serves the built SPA from /var/www/techcup (copy of frontend/dist).
# - Proxies /api to the Spring Boot backend listening on 127.0.0.1:8080 (systemd service).
# - Shared security headers live in /etc/nginx/snippets/techcup-security-headers.conf (a copy of
#   frontend/security-headers.conf). nginx does not inherit add_header into a location that sets
#   its own, so every such location includes the snippet again.
#
# Install: see DEPLOY.md. Replace SERVER_NAME below with the domain or the server IP.

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    root /var/www/techcup;
    index index.html;

    # The API accepts uploads of up to 5 MB; leave room for the multipart envelope.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/techcup-security-headers.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (never append): the backend (Tomcat RemoteIpValve, prod profile) takes the
        # right-most untrusted X-Forwarded-For value as the client IP for the login rate limiter;
        # overwriting guarantees that value is the real peer and no client-supplied one survives.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed bundles: safe to cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/techcup-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Entry point: never cached, so a new deployment is picked up immediately.
    location = /index.html {
        include /etc/nginx/snippets/techcup-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Client-side routing: unknown paths fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
