spring:
  application:
    name: techcup

  datasource:
    # 127.0.0.1 (not localhost) and 5433 to avoid a native PostgreSQL on 5432.
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/techcup}
    username: ${DB_USER:techcup}
    password: ${DB_PASSWORD:techcup}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 32

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    mongodb:
      # docker-compose.yml starts MongoDB with authentication enabled and this dev root user.
      uri: ${MONGO_URI:mongodb://techcup:techcup@127.0.0.1:27018/techcup?authSource=admin}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  jackson:
    # Nullable fields are serialized as explicit nulls (not omitted) so responses
    # match the documented DTO shapes and clients can rely on the key being there.
    default-property-inclusion: always

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

app:
  jwt:
    # Must be at least 32 bytes for HS256. The "prod" profile refuses to start with this value.
    secret: ${JWT_SECRET:techcup-dev-only-secret-change-me-please-0123456789abcdef}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  institutional-domains: ${APP_INSTITUTIONAL_DOMAINS:escuelaing.edu.co,mail.escuelaing.edu.co}
  # Zone used for every "today" / "now" business rule (tournament dates, kick-off times).
  time-zone: ${APP_TIME_ZONE:America/Bogota}
  storage:
    max-file-size-bytes: 5242880
  bootstrap:
    # The administrator is created at startup when no ADMIN user exists yet.
    # The "prod" profile refuses to start with the default password.
    admin-email: ${ADMIN_EMAIL:admin@escuelaing.edu.co}
    admin-password: ${ADMIN_PASSWORD:Admin123*}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    edu.escuelaing.techcup: INFO
