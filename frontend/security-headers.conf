# Shared security headers. Included at server level and again inside every location that
# declares its own add_header (nginx replaces, rather than merges, inherited add_header sets).
#
# CSP notes, verified against the app:
# - script-src 'self': Vite emits hashed module scripts only; Tailwind v4 adds no inline scripts.
# - style-src 'unsafe-inline': the Select atom and a few components use inline style attributes.
# - img-src blob: data: — useFileUrl/Avatar render object URLs; Select uses a data: SVG background.
# - frame-src blob: — FilePreview shows PDFs in an <iframe src="blob:...">.
# - connect-src 'self': the API is proxied under the same origin (/api).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; frame-src blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
