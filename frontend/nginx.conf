# Production server for the built SPA. Proxies /api to the backend container so the browser
# talks to a single origin. Security headers live in security-headers.conf because nginx's
# add_header is NOT inherited by a location that declares its own add_header: every location
# that sets a header must re-include the shared snippet.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API accepts uploads of up to 5 MB (photos, venue images, receipts, rulebook PDF);
    # leave a small margin for the multipart envelope. Larger bodies get a 413.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (never append): the backend (Tomcat RemoteIpValve, prod profile) takes the
        # right-most untrusted X-Forwarded-For value as the client IP for the login rate limiter;
        # overwriting guarantees that value is the real peer and no client-supplied one survives.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed bundles: safe to cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Entry point: never cache, so deployments are picked up immediately.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Client-side routing: unknown paths fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
